<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebRTC MediaPipe Hands Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#02030a;color:white;font-family:Arial,sans-serif;
}
#remoteVideo{
  position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;
  transform:scaleX(-1);opacity:.92;background:#02040c;z-index:1;
}
#localVideo{display:none}
#fx{
  position:fixed;inset:0;width:100vw;height:100vh;z-index:3;pointer-events:none;
}
#overlay{
  position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(0,80,255,.18),rgba(0,0,0,.88));
}
#panel{
  width:min(560px,calc(100vw - 40px));padding:26px;
  border:1px solid rgba(100,200,255,.45);border-radius:22px;
  background:rgba(0,10,28,.78);box-shadow:0 0 45px rgba(0,160,255,.4);
  text-align:center;backdrop-filter:blur(10px);
}
h1{margin:0 0 12px;font-size:30px}
input{
  width:90%;padding:12px;margin:12px 0;border-radius:12px;
  border:1px solid rgba(100,200,255,.5);background:rgba(0,0,0,.35);
  color:white;font-size:18px;text-align:center;
}
button{
  padding:13px 24px;border:0;border-radius:999px;color:white;font-size:18px;cursor:pointer;
  background:linear-gradient(90deg,#006dff,#8b2cff,#00e5ff);
  box-shadow:0 0 24px rgba(0,190,255,.55);
}
#status{
  position:fixed;left:18px;bottom:16px;z-index:6;color:rgba(210,240,255,.86);
  font-size:14px;text-shadow:0 0 8px #00aaff;
}
#debug{
  position:fixed;right:18px;bottom:16px;z-index:6;color:rgba(210,240,255,.72);
  font-size:13px;text-align:right;text-shadow:0 0 8px #00aaff;
}
</style>
</head>
<body>
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline></video>
<canvas id="fx"></canvas>

<div id="overlay">
  <div id="panel">
    <h1>Magic Portal + MediaPipe Hands</h1>
    <p>Both users enter the same room.<br>
    You see only the remote webcam. Your hand is tracked locally.</p>
    <input id="roomInput" value="portal-room">
    <br>
    <button id="startBtn">Open Portal</button>
  </div>
</div>

<div id="status">Portal closed</div>
<div id="debug">Hands: off</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18";

const remoteVideo = document.getElementById("remoteVideo");
const localVideo = document.getElementById("localVideo");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const roomInput = document.getElementById("roomInput");
const statusEl = document.getElementById("status");
const debugEl = document.getElementById("debug");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");

let ws = null;
let pc = null;
let localStream = null;
let room = "portal-room";
let role = null;
let hasMadeOffer = false;

let handLandmarker = null;
let lastVideoTime = -1;
let localHand = null;   // normalized mirrored coordinates {x,y}
let remoteHand = null;  // normalized mirrored coordinates {x,y}
let magicTouch = false;
let lastTouchSound = 0;

let particles = [];
let magicPulse = 0;
let audioCtx = null;

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

function status(s){ statusEl.textContent = s; }
function wsUrl(){ return (location.protocol === "https:" ? "wss:" : "ws:") + "//" + location.host; }

async function initMediaPipe(){
  status("Loading MediaPipe Hands...");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.55,
    minHandPresenceConfidence: 0.55,
    minTrackingConfidence: 0.50
  });

  debugEl.textContent = "Hands: MediaPipe ready";
}

async function startPortal(){
  room = roomInput.value.trim() || "portal-room";
  overlay.style.display = "none";
  status("Requesting webcam...");

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  localStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 },
      frameRate: { ideal: 30 }
    },
    audio: false
  });

  localVideo.srcObject = localStream;
  await localVideo.play().catch(()=>{});

  await initMediaPipe();

  ws = new WebSocket(wsUrl());

  ws.onopen = () => {
    status("Joining room: " + room);
    ws.send(JSON.stringify({ type: "join", room }));
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);

    if(msg.type === "joined"){
      role = msg.role;
      status("Joined as " + role + ". Users in room: " + msg.count);
      return;
    }

    if(msg.type === "ready"){
      if(!pc) await createPeer();
      if(role === "caller" && !hasMadeOffer) await makeOffer();
      return;
    }

    if(msg.type === "offer"){
      if(!pc) await createPeer();
      if(pc.signalingState !== "stable"){
        console.warn("Ignoring offer, state:", pc.signalingState);
        return;
      }
      status("Received offer. Sending answer...");
      await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: "answer", answer }));
      return;
    }

    if(msg.type === "answer"){
      if(!pc || pc.signalingState !== "have-local-offer"){
        console.warn("Ignoring answer, state:", pc ? pc.signalingState : "no pc");
        return;
      }
      status("Received answer...");
      await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
      return;
    }

    if(msg.type === "candidate"){
      if(!pc || !msg.candidate) return;
      try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }
      catch(err){ console.warn("ICE error", err); }
      return;
    }

    if(msg.type === "hand"){
      remoteHand = { x: msg.x, y: msg.y, t: performance.now() };
      return;
    }

    if(msg.type === "peer-left"){
      status("Other side closed.");
      remoteVideo.srcObject = null;
      remoteHand = null;
      hasMadeOffer = false;
      if(pc){ pc.close(); pc = null; }
      return;
    }
  };

  ws.onclose = () => status("WebSocket closed.");

  requestAnimationFrame(trackHands);
}

async function createPeer(){
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:openrelay.metered.ca:80" },
      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      },
      {
        urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  });

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (e) => {
    remoteVideo.srcObject = e.streams[0];
    remoteVideo.play().catch(console.warn);
    status("Portal open: receiving remote webcam.");
    magicPulse = 1;
    playBell();
  };

  pc.onicecandidate = (e) => {
    if(e.candidate && ws && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({ type: "candidate", candidate: e.candidate }));
    }
  };

  pc.onconnectionstatechange = () => {
    status("WebRTC: " + pc.connectionState + " | role: " + role);
    if(pc.connectionState === "connected") magicPulse = 1;
  };
}

async function makeOffer(){
  hasMadeOffer = true;
  status("Creating offer as caller...");
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({ type: "offer", offer }));
}

function trackHands(){
  if(handLandmarker && localVideo.readyState >= 2 && localVideo.currentTime !== lastVideoTime){
    lastVideoTime = localVideo.currentTime;

    const result = handLandmarker.detectForVideo(localVideo, performance.now());

    if(result.landmarks && result.landmarks.length > 0){
      // Index fingertip = landmark 8.
      const tip = result.landmarks[0][8];

      // MediaPipe x is camera coordinates. We mirror it because the portal image is mirrored.
      localHand = {
        x: 1.0 - tip.x,
        y: tip.y,
        t: performance.now()
      };

      if(ws && ws.readyState === WebSocket.OPEN){
        ws.send(JSON.stringify({
          type: "hand",
          x: localHand.x,
          y: localHand.y
        }));
      }

      debugEl.textContent =
        "Local hand: " + localHand.x.toFixed(2) + ", " + localHand.y.toFixed(2) +
        (remoteHand ? " | Remote hand: " + remoteHand.x.toFixed(2) + ", " + remoteHand.y.toFixed(2) : " | Remote hand: none");
    }
    else {
      localHand = null;
      debugEl.textContent = "Local hand: none" + (remoteHand ? " | Remote hand: yes" : " | Remote hand: none");
    }
  }

  requestAnimationFrame(trackHands);
}

function screenPos(h){
  return {
    x: h.x * canvas.width,
    y: h.y * canvas.height
  };
}

function updateMagicTouch(){
  magicTouch = false;

  const now = performance.now();

  // Remote hand expires after 700 ms.
  if(remoteHand && now - remoteHand.t > 700) remoteHand = null;

  if(localHand && remoteHand){
    const a = screenPos(localHand);
    const b = screenPos(remoteHand);
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if(d < Math.min(canvas.width, canvas.height) * 0.10){
      magicTouch = true;
      magicPulse = Math.min(1, magicPulse + 0.10);
      spawnBurst((a.x + b.x) * 0.5, (a.y + b.y) * 0.5);
      if(now - lastTouchSound > 450){
        playBell();
        lastTouchSound = now;
      }
    }
  }
}

function playBell(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(.0001, now);
  g.gain.exponentialRampToValueAtTime(.22, now + .02);
  g.gain.exponentialRampToValueAtTime(.0001, now + .7);
  g.connect(audioCtx.destination);

  [523.25, 783.99, 1046.5].forEach((f,i)=>{
    const o = audioCtx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(f, now + i * .035);
    o.connect(g);
    o.start(now + i * .035);
    o.stop(now + .72);
  });
}

function spawnPortalParticle(){
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2;
  const rx = w*.47, ry = h*.47;
  const a = Math.random() * Math.PI * 2;

  particles.push({
    x: cx + Math.cos(a)*rx,
    y: cy + Math.sin(a)*ry,
    vx: -Math.sin(a)*(0.7 + Math.random()*2.5),
    vy:  Math.cos(a)*(0.7 + Math.random()*2.5),
    r: 1 + Math.random()*4,
    life: .6 + Math.random()*1.6,
    max: 1.8,
    hue: magicTouch ? 292 : 200
  });
}

function spawnBurst(x,y){
  for(let i=0;i<14;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 2 + Math.random()*6;
    particles.push({
      x,y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      r: 2 + Math.random()*6,
      life: .4 + Math.random()*1.0,
      max: 1.1,
      hue: 292
    });
  }
}

function drawHand(h, label, hue){
  if(!h) return;
  const p = screenPos(h);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = `hsla(${hue},100%,70%,0.9)`;
  ctx.fillStyle = `hsla(${hue},100%,65%,0.65)`;
  ctx.shadowColor = `hsl(${hue},100%,65%)`;
  ctx.shadowBlur = 25;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 28, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.font = "16px Arial";
  ctx.fillText(label, p.x + 18, p.y - 18);
  ctx.restore();
}

function drawEnergyBeam(){
  if(!localHand || !remoteHand || !magicTouch) return;
  const a = screenPos(localHand);
  const b = screenPos(remoteHand);
  const t = performance.now()*0.001;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for(let i=0;i<7;i++){
    const mx = (a.x+b.x)/2 + Math.sin(t*8+i)*22;
    const my = (a.y+b.y)/2 + Math.cos(t*7+i)*22;
    ctx.strokeStyle = `hsla(${i%2?292:190},100%,70%,${0.08+i*0.04})`;
    ctx.lineWidth = 2 + i;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(mx,my,b.x,b.y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFx(){
  updateMagicTouch();

  const w = canvas.width, h = canvas.height;
  const t = performance.now()*.001;

  ctx.clearRect(0,0,w,h);
  magicPulse *= .965;

  for(let i=0;i<10;i++) spawnPortalParticle();

  const cx = w/2, cy = h/2;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  for(let i=0;i<10;i++){
    const pad = i*13 + Math.sin(t*3+i)*8;
    const hue = magicTouch || magicPulse>.25 ? 292 : 200;
    ctx.strokeStyle = `hsla(${hue},100%,${60+i*2}%,${.08+i*.025})`;
    ctx.lineWidth = 3 + i*1.5;
    ctx.beginPath();
    ctx.ellipse(cx, cy, w*.48-pad, h*.48-pad, t+i*.15, 0, Math.PI*2);
    ctx.stroke();
  }

  for(const p of particles){
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 1/60;
    const a = Math.max(0, p.life/p.max);
    ctx.fillStyle = `hsla(${p.hue},100%,65%,${a})`;
    ctx.shadowColor = `hsla(${p.hue},100%,70%,${a})`;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*(.5+a),0,Math.PI*2);
    ctx.fill();
  }

  particles = particles.filter(p=>p.life>0);
  if(particles.length>2000) particles.splice(0, particles.length-2000);

  ctx.restore();

  drawEnergyBeam();
  drawHand(localHand, "you", 190);
  drawHand(remoteHand, "remote", 292);

  if(magicTouch){
    ctx.save();
    ctx.fillStyle = "rgba(255,120,255,0.95)";
    ctx.shadowColor = "#ff00ff";
    ctx.shadowBlur = 25;
    ctx.font = "bold 38px Arial";
    ctx.textAlign = "center";
    ctx.fillText("MAGIC TOUCH!", w/2, h-70);
    ctx.restore();
  }

  requestAnimationFrame(drawFx);
}

startBtn.onclick = () => {
  startPortal().catch(err=>{
    overlay.style.display = "flex";
    status("Error: " + err.message);
    console.error(err);
  });
};

drawFx();
</script>
</body>
</html>
