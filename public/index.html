<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Magic WebRTC Portal Fixed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:white;font-family:Arial,sans-serif}
#remoteVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;transform:scaleX(-1);opacity:.92;background:#02040c;z-index:1}
#localVideo{display:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:3;pointer-events:none}
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,80,255,.18),rgba(0,0,0,.88))}
#panel{width:min(520px,calc(100vw - 40px));padding:26px;border:1px solid rgba(100,200,255,.45);border-radius:22px;background:rgba(0,10,28,.78);box-shadow:0 0 45px rgba(0,160,255,.4);text-align:center}
h1{margin:0 0 12px;font-size:32px}
input{width:90%;padding:12px;margin:12px 0;border-radius:12px;border:1px solid rgba(100,200,255,.5);background:rgba(0,0,0,.35);color:white;font-size:18px;text-align:center}
button{padding:13px 24px;border:0;border-radius:999px;color:white;font-size:18px;cursor:pointer;background:linear-gradient(90deg,#006dff,#8b2cff,#00e5ff);box-shadow:0 0 24px rgba(0,190,255,.55)}
#status{position:fixed;left:18px;bottom:16px;z-index:6;color:rgba(210,240,255,.86);font-size:14px;text-shadow:0 0 8px #00aaff}
</style>
</head>
<body>
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline></video>
<canvas id="fx"></canvas>
<div id="overlay"><div id="panel"><h1>Magic WebRTC Portal</h1><p>Both users enter the same room name.<br>You only see the other webcam.</p><input id="roomInput" value="portal-room"><br><button id="startBtn">Open Portal</button></div></div>
<div id="status">Portal closed</div>
<script>
const remoteVideo=document.getElementById('remoteVideo'),localVideo=document.getElementById('localVideo'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),roomInput=document.getElementById('roomInput'),statusEl=document.getElementById('status'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
let ws=null,pc=null,localStream=null,room='portal-room',role=null,hasMadeOffer=false,particles=[],magicPulse=0,audioCtx=null;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight} addEventListener('resize',resize); resize();
function status(s){statusEl.textContent=s}
function wsUrl(){return (location.protocol==='https:'?'wss:':'ws:')+'//'+location.host}
async function startPortal(){
  room=roomInput.value.trim()||'portal-room'; overlay.style.display='none'; status('Requesting webcam...');
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  localVideo.srcObject=localStream;
  ws=new WebSocket(wsUrl());
  ws.onopen=()=>{status('Joining room: '+room);ws.send(JSON.stringify({type:'join',room}))};
  ws.onmessage=async e=>{
    const msg=JSON.parse(e.data);
    if(msg.type==='joined'){role=msg.role;status('Joined as '+role+'. Users in room: '+msg.count);return;}
    if(msg.type==='ready'){if(!pc)await createPeer(); if(role==='caller'&&!hasMadeOffer)await makeOffer(); return;}
    if(msg.type==='offer'){
      if(!pc)await createPeer();
      if(pc.signalingState!=='stable'){console.warn('Ignoring offer, state:',pc.signalingState);return;}
      status('Received offer. Sending answer...');
      await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({type:'answer',answer}));
      return;
    }
    if(msg.type==='answer'){
      if(!pc||pc.signalingState!=='have-local-offer'){console.warn('Ignoring answer, state:',pc?pc.signalingState:'no pc');return;}
      status('Received answer...');
      await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
      return;
    }
    if(msg.type==='candidate'){if(!pc||!msg.candidate)return; try{await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));}catch(err){console.warn('ICE error',err)} return;}
    if(msg.type==='peer-left'){status('Other side closed.');remoteVideo.srcObject=null;hasMadeOffer=false;if(pc){pc.close();pc=null;}return;}
  };
}
async function createPeer(){
  pc=new RTCPeerConnection({iceServers:[
  {urls:'stun:openrelay.metered.ca:80'},
  {
    urls:'turn:openrelay.metered.ca:80',
    username:'openrelayproject',
    credential:'openrelayproject'
  },
  {
    urls:'turn:openrelay.metered.ca:443',
    username:'openrelayproject',
    credential:'openrelayproject'
  }
]});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.ontrack=e=>{remoteVideo.srcObject=e.streams[0];status('Portal open: receiving remote webcam.');magicPulse=1;playBell();};
  pc.onicecandidate=e=>{if(e.candidate&&ws&&ws.readyState===1)ws.send(JSON.stringify({type:'candidate',candidate:e.candidate}))};
  pc.onconnectionstatechange=()=>{status('WebRTC: '+pc.connectionState+' | role: '+role);if(pc.connectionState==='connected')magicPulse=1;};
}
async function makeOffer(){hasMadeOffer=true;status('Creating offer as caller...');const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',offer}));}
function playBell(){if(!audioCtx)return;const now=audioCtx.currentTime,g=audioCtx.createGain();g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.2,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.7);g.connect(audioCtx.destination);[523.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type='sine';o.frequency.setValueAtTime(f,now+i*.035);o.connect(g);o.start(now+i*.035);o.stop(now+.72);});}
function spawn(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,rx=w*.47,ry=h*.47,a=Math.random()*Math.PI*2;particles.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,vx:-Math.sin(a)*(0.7+Math.random()*2.4),vy:Math.cos(a)*(0.7+Math.random()*2.4),r:1+Math.random()*4,life:.5+Math.random()*1.5,max:1.8,hue:magicPulse>.2?292:200});}
function drawFx(){const w=canvas.width,h=canvas.height,t=performance.now()*.001;ctx.clearRect(0,0,w,h);magicPulse*=.965;for(let i=0;i<10;i++)spawn();const cx=w/2,cy=h/2;ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<9;i++){const pad=i*13+Math.sin(t*3+i)*8;ctx.strokeStyle=`hsla(${magicPulse>.2?292:200},100%,${60+i*2}%,${.08+i*.025})`;ctx.lineWidth=3+i*1.5;ctx.beginPath();ctx.ellipse(cx,cy,w*.48-pad,h*.48-pad,t+i*.15,0,Math.PI*2);ctx.stroke();}for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=1/60;const a=Math.max(0,p.life/p.max);ctx.fillStyle=`hsla(${p.hue},100%,65%,${a})`;ctx.shadowColor=`hsla(${p.hue},100%,70%,${a})`;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.5+a),0,Math.PI*2);ctx.fill();}particles=particles.filter(p=>p.life>0);if(particles.length>1800)particles.splice(0,particles.length-1800);ctx.restore();requestAnimationFrame(drawFx)}
startBtn.onclick=()=>startPortal().catch(err=>{overlay.style.display='flex';status('Error: '+err.message);console.error(err)});
drawFx();
</script>
</body>
</html>
